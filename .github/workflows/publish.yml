name: Publish to npm with provenance

on:
  push:
    tags:
      - 'v*'

# Force GitHub Actions to use Node.js 24 internally (future-proof)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write # REQUIRED for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ships npm 11, which trusted publishing (OIDC) requires
          registry-url: 'https://registry.npmjs.org'

      # Install deps
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tag must name the version in package.json, or npm would publish something else
      - name: Check tag matches package.json
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag v$TAG does not match package.json version $PKG"; exit 1
          fi

      # Build project
      - name: Build
        run: pnpm run build

      # Nothing is published unless lint and the offline tests pass
      - name: Lint
        run: pnpm run lint

      - name: Test
        run: node --test test/WhatsAuto.test.js

      # Publish through npm trusted publishing: npm checks this repo + workflow via OIDC
      # (id-token: write above), so no NPM_TOKEN secret is used. n8n verification requires provenance.
      - name: Publish package
        run: npm publish --provenance --access public
