name: Publish to npm with provenance

on:
  push:
    tags:
      - 'v*'

# Force GitHub Actions to use Node.js 24 internally (future-proof)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  id-token: write # REQUIRED for npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      # Checkout code
      - name: Checkout
        uses: actions/checkout@v4

      # Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24' # ships npm 11, which trusted publishing (OIDC) requires
          registry-url: 'https://registry.npmjs.org'

      # Install deps
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build project
      - name: Build
        run: pnpm run build

      # Publish through npm trusted publishing: npm checks this repo + workflow via OIDC
      # (id-token: write above), so no NPM_TOKEN secret is used. Provenance is added automatically.
      - name: Publish package
        run: npm publish --access public
